CantRunSSE42Title=No se puede iniciar LightZone
CantRunSSE42=LightZone en Linux requiere una CPU que soporte el conjunto de instrucciones SSE4.2.  Este requisito fue introducido en la version 5.1, en 2026.
FoundProcCpuinfo=LightZone ha examinado /proc/cpuinfo on este ordenador y encuentra "$1", sin instrucciones SSE4.2.  LightZone debe cerrarse.

