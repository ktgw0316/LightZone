CantRunSSE42Title=Kan LightZone niet starten
CantRunSSE42=LightZone op Linux heeft een processor (CPU) nodig die de SSE4.2 instructie set ondersteunt.  Deze eis is ingevoerd met versie 5.1, in 2026.
FoundProcCpuinfo=LightZone heeft /proc/cpuinfo onderzocht op deze computer en heeft "$1" gevonden, waar de SSE4.2 vlag niet aan staat.  LightZone moet nu worden gesloten.

