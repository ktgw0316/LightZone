CantRunSSE42=LightZone sous Linux requi\u00e8re Un processeur supportant le jeu d'instruction SSE4.2.  Ce pr\u00e9-requis a \u00e9t\u00e9 introduit dans la version 5.1, en 2026.
FoundProcCpuinfo=LightZone a examin\u00e9 /proc/cpuinfo sur cet ordinateur et a trouv\u00e9 "$1", sans drapeau SSE4.2 d\u00e9fini.  LightZone doit quitter maintenant.

