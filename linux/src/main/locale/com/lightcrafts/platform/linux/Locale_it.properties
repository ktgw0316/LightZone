CantRunSSE42Title=Impossibile avviare LightZone
CantRunSSE42=LightZone su Linux richiede una CPU che supporti il set di istruzioni SSE4.2.  Tale requisito \u00e8 stato introdotto con la versione 5.1, nel 2026.
FoundProcCpuinfo=LightZone ha esaminato /proc/cpuinfo su questo computer: ha trovato "$1" e nessun set del flag SSE4.2.  Ora \u00e8 necessario chiudere LightZone.

SaveTitle=Salva
