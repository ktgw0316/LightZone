CantRunSSE42Title=Can't Launch LightZone
CantRunSSE42=LightZone on Linux requires a CPU supporting the SSE4.2 instruction set.  This requirement was introduced with version 5.1, in 2007.
FoundProcCpuinfo=LightZone has examined /proc/cpuinfo on this computer and found "$1", with no SSE4.2 flag set.  LightZone must now quit.

